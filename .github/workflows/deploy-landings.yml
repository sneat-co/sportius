name: Deploy reserved web scaffold (manual only)

# Public web UI is outside the Telegram MVP. Keep this manual-only until a web
# initiative replaces the generated scaffold and configures a real origin.
on:
  workflow_dispatch:

concurrency:
  group: deploy-landings-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: sneat-co/cicd/.github/workflows/cf-deploy.yml@main
    with:
      working-directory: landings
      build-command: PUBLIC_SITE_URL='${{ vars.PUBLIC_SITE_URL }}' pnpm build
      cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      extra-install-directory: "."
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
